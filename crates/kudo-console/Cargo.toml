[package]
name = "kudo-console"
version = "0.1.0"
edition = "2024"
description = "kudo's console: a Dioxus fullstack face over the context engine and the hub"

[lints]
workspace = true

[dependencies]
dioxus = { version = "=0.7.4", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
# Server side only: the engine and the hub client the server functions call.
kudo-context = { path = "../kudo-context", optional = true }
kudo-shim = { path = "../kudo-shim", optional = true }
tokio = { workspace = true, optional = true }
kudo-worker = { path = "../kudo-worker", optional = true }
jiff = { workspace = true, optional = true }
hub-protocol = { workspace = true, optional = true }
vox = { workspace = true, optional = true }
moco-job = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
dioxus-ssr = "=0.7.4"
kudo-worker = { path = "../kudo-worker" }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:kudo-context", "dep:kudo-shim", "dep:tokio", "dep:hub-protocol", "dep:vox", "dep:kudo-worker", "dep:jiff", "dep:moco-job"]
