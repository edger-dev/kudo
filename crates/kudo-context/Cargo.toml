[package]
name = "kudo-context"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# An engine: a library linked into every composition root that needs it (the
# shim, the node, the console), so a pull or a submit reaches the store with no
# node and no hub on the path. Phase 1 stores into a local kinora store; phase 3
# puts that store on an object store.
[dependencies]
kinora = { workspace = true }
kinora-remote = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
object_store = { version = "0.14.2", default-features = false }
async-trait = "0.1"
futures = "0.3"
