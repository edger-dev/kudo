[package]
name = "kudo-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { workspace = true }
kudo-context = { path = "../kudo-context" }
kudo-intake = { path = "../kudo-intake" }
kudo-worker = { path = "../kudo-worker" }
hub-protocol = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
vox = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rmcp = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }

# The engine's wire types. Encoding happens here and decoding happens in the
# engine, so only bytes cross the hub — which is what keeps moco's facet 0.43
# and hub's 0.50 from ever meeting.
moco-job = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
hub = { workspace = true }
node = { workspace = true }
kudo-node = { path = "../kudo-node" }
kinora = { workspace = true }
