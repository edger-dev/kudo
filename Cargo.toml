[workspace]
resolver = "2"
members = ["crates/kudo-node", "crates/kudo-shim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"          # rule: (rung 2) unsafe is forbidden outright

# Lint rules live in the kinora `rules` root (see templates/rust/rules/). Each
# line below is a rung-1 rule projected into clippy config; the `# rule:` tag
# cites the rule kino it enforces. Promote a line to "deny" to graduate it to
# rung 2. See the "Lint Rules" section of CLAUDE.md.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"            # rule: jig::rust::no-unwrap-in-lib
expect_used = "warn"            # rule: jig::rust::no-unwrap-in-lib
todo = "warn"                   # rule: jig::rust::no-todo-committed
unimplemented = "warn"          # rule: jig::rust::no-todo-committed
dbg_macro = "warn"              # rule: jig::rust::no-todo-committed

[workspace.dependencies]

# Cross-component crate dependencies are pinned git revisions, never path deps.
# spec: cross-component-crate-deps-are-pinned-git
# (kudo:8b09e3e9bdc7712b5e53412964fd2d4668e095e2a13e3d2b74c77e1bac3c11de)
#
# Local iteration across kudo and hub uses an *uncommitted* override, so what
# everyone else builds is this revision:
#   [patch."https://github.com/edger-dev/hub"]
#   hub-protocol = { path = "../hub/crates/hub-protocol" }
hub-protocol = { git = "https://github.com/edger-dev/hub", rev = "dbc40efec43ebc385d92c608144610dfadbd7145" }

# `node` is a real dependency of the composition root (kudo-node assembles a
# daemon out of it) and a dev-dependency of the shim's routing tests, which run
# a real hub and a real node rather than a mock of the far side.
hub = { git = "https://github.com/edger-dev/hub", rev = "dbc40efec43ebc385d92c608144610dfadbd7145" }
node = { git = "https://github.com/edger-dev/hub", rev = "dbc40efec43ebc385d92c608144610dfadbd7145" }

# Kept on hub's line: hub-protocol's types are facet-derived, so the shim must
# encode against the same major. See RFC-0006 on the facet version skew.
facet = "0.50.0-rc.5"
facet-json = "0.50.0-rc.5"
vox = "0.10.0-rc.5"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-std"] }
rmcp = { version = "3.0.0-beta.2", features = ["server", "transport-io"] }

# The engine the composition root hosts. A second component dependency, and the
# first time two facet versions meet in one build graph — safe only because the
# boundary between them is bytes. See RFC-0006.
moco-job = { git = "https://github.com/edger-dev/moco", rev = "3434aaa040675b9a6f504e8c8d34468a27bbb3fb" }
serde = { version = "1", features = ["derive"] }
